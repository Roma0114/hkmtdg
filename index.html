<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1035" />
  <title>İyi ki Doğdun! 🎂</title>
  <meta name="description" content="Doğum günün kutlu olsun yakışıklı, aç bakalım 🎁" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- Fotoğrafları kalp şeklinde kesmek için -->
    <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
      <path d="M0.5,0.94 C0.5,0.94 0.02,0.64 0.02,0.31 C0.02,0.14 0.15,0.03 0.29,0.03 C0.39,0.03 0.46,0.09 0.5,0.17 C0.54,0.09 0.61,0.03 0.71,0.03 C0.85,0.03 0.98,0.14 0.98,0.31 C0.98,0.64 0.5,0.94 0.5,0.94 Z" />
    </clipPath>
  </svg>

  <div id="pink" aria-hidden="true"></div>
  <div class="spot spot-l" aria-hidden="true"></div>
  <div class="spot spot-r" aria-hidden="true"></div>
  <div id="floaters" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="flash" aria-hidden="true"></div>
  <div id="countdown" aria-hidden="true"></div>

  <!-- Açılış -->
  <section id="gate">
    <p class="gate-warn">DOĞUM GÜNÜN<br>KUTLU OLSUN<br><span class="gate-name">YAKIŞIKLI</span><span class="gate-sub">aç bakalım 🎁</span></p>
    <button id="gift" class="gift" aria-label="Hediyeyi aç">
      <span class="gift-lid"><span class="gift-bow"></span></span>
      <span class="gift-box"></span>
    </button>
  </section>

  <main id="app" hidden>
    <h1 id="title" class="title"></h1>

    <div id="centerStage" class="center-stage">
      <div class="cake-wrap">
        <div id="cake" class="cake">
          <div id="candles" class="candles"></div>
          <div class="tier tier-top"><span class="drip"></span></div>
          <div class="tier tier-mid"><span class="drip"></span></div>
          <div class="tier tier-bot"><span class="drip"></span></div>
          <div class="plate"></div>
        </div>
      </div>
      <div id="photoHeart" class="photo-heart"></div>
    </div>

    <div class="hint-area">
      <p id="micHint" class="mic-hint" hidden>🎤 MİKROFONA ÜFLE!</p>
      <button id="blowBtn" class="btn" hidden>
        <small>sanırım nefesin yetmedi 😮‍💨</small>
        TUŞA BASARAK ÜFLE
      </button>
    </div>

    <div id="stage" class="stage"></div>
    <div class="cats cats-left" aria-hidden="true"></div>
    <div class="cats cats-right" aria-hidden="true"></div>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightboxImg" alt="" />
  </div>

  <button id="musicBtn" class="music-btn" hidden aria-label="Müziği aç/kapat">🔊</button>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
